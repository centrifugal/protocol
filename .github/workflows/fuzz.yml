name: fuzz
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - FuzzJSONDecodeSingle
          - FuzzJSONDecodeMultiple
          - FuzzProtobufDecode
          - FuzzProtobufReplyDecode
          - FuzzProtobufStreamDecode
          - FuzzJSONStreamDecode
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Fuzz
        run: go test -run=^$ -fuzz=^${{ matrix.target }}$ -fuzztime=5m
      - name: Upload failing corpus
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-corpus-${{ matrix.target }}
          path: testdata/fuzz
