name: fuzz
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: ["."]
        target:
          - FuzzJSONCommandDecode
          - FuzzProtobufCommandDecode
          - FuzzProtobufReplyDecode
          - FuzzProtobufStreamDecode
          - FuzzJSONStreamDecode
          - FuzzJSONCommandRoundTrip
          - FuzzJSONReplyRoundTrip
          # Payloads of applications against what encoders make of them.
          - FuzzJSONPayloads
          # Generated Protobuf code against google.golang.org/protobuf.
          - FuzzProtobufMatchesOfficial
        include:
          # The runtime of the JSON code generator.
          - dir: cfjson
            target: FuzzValid
          - dir: cfjson
            target: FuzzString
          - dir: cfjson
            target: FuzzInt
          # Generated JSON code against the easyjson and segmentio based code
          # it replaced, a module of its own.
          - dir: internal/cfjsoncmp
            target: FuzzDecodeMatchesSegmentio
          - dir: internal/cfjsoncmp
            target: FuzzValidMatchesSegmentio
          # The Protobuf code generator, on types covering all it supports.
          - dir: cfprotobuf/internal/testtypes
            target: FuzzUnmarshal
          # Generated Protobuf code against the vtprotobuf code it replaced, a
          # module of its own.
          - dir: internal/cfprotobufcmp
            target: FuzzUnmarshalMatchesVTProtobuf
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      # What the fuzzer found interesting on the nights before. Without it
      # every run starts from the seeds in the repository and gets no further
      # than the first run did. A cache is never updated, so each run saves
      # one of its own and restores the latest.
      - name: Fuzz cache path
        id: fuzzcache
        run: echo "dir=$(go env GOCACHE)/fuzz" >> "$GITHUB_OUTPUT"

      - name: Restore fuzz corpus
        uses: actions/cache@v4
        with:
          path: ${{ steps.fuzzcache.outputs.dir }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-

      - name: Fuzz
        working-directory: ${{ matrix.dir }}
        # -vet=off: the old generated code kept in internal/cfjsoncmp copies
        # structs with locks.
        run: go test -vet=off -run=^$ -fuzz=^${{ matrix.target }}$ -fuzztime=5m .
      - name: Upload failing corpus
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-corpus-${{ matrix.target }}
          path: ${{ matrix.dir }}/testdata/fuzz
